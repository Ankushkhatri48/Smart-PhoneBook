# Server Port (Render automatically PORT variable deta hai)
server.port=${PORT:8080}

# Database Configuration (Local defaults + Render Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcontact}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Hello1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect