<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{user/user_base::layout(~{::section})}">
<head>
    <meta charset="utf-8">
    <title>User Dashboard</title>
</head>
<body>
<section>
    <div class="container">
        <div class="card shadow-sm border-0 p-4 text-center">
            <div class="card-body">
                <div class="mb-3">
                    <i class="fa-solid fa-circle-user fa-5x text-secondary"></i>
                </div>

                <h2 class="fw-bold">Welcome, <span th:text="${user.name}">User</span>!</h2>
                <p class="text-muted mb-4" th:text="${user.about != null and !user.about.isEmpty() ? user.about : 'Manage all your personal and professional contacts in one secure place.'}"></p>

                <div class="row justify-content-center mb-4">
                    <div class="col-md-4">
                        <div class="p-3 bg-light rounded border">
                            <h5 class="text-secondary mb-1">Total Saved Contacts</h5>
                            <h2 class="fw-bold text-dark mb-0" th:text="${totalContacts}">0</h2>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <a th:href="@{/user/add-contact}" class="btn btn-primary-custom btn-lg px-4">
                        <i class="fa-solid fa-user-plus me-2"></i>Add New Contact
                    </a>
                    <a th:href="@{/user/show-contacts/0}" class="btn btn-outline-secondary btn-lg px-4">
                        <i class="fa-solid fa-address-card me-2"></i>View All Contacts
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
