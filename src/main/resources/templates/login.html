<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body>
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <i class="fa-solid fa-right-to-bracket fa-3x text-secondary mb-2"></i>
                            <h2 class="fw-bold">Sign In</h2>
                        </div>

                        <!-- Login Error Alert -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            Invalid email or password. Please try again.
                        </div>

                        <!-- Logout Success Alert -->
                        <div th:if="${param.logout}" class="alert alert-success">
                            You have been logged out successfully.
                        </div>

                        <form th:action="@{/dologin}" method="post">

                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Email Address</label>
                                <input type="text"
                                       name="username"
                                       id="username"
                                       class="form-control"
                                       placeholder="Enter your registered email"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password"
                                       name="password"
                                       id="password"
                                       class="form-control"
                                       placeholder="Enter your password"
                                       required>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary-custom btn-lg">Login</button>
                            </div>

                            <div class="text-center">
                                <span class="text-muted">Don't have an account?</span>
                                <a th:href="@{/signup}" class="text-decoration-none fw-semibold">Register here</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
