<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{user/user_base::layout(~{::section})}">
<head>
    <meta charset="utf-8">
    <title>Your Contacts</title>
</head>
<body>
<section>
    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center fw-bold mb-4">
                    <i class="fa-solid fa-address-card me-2 text-secondary"></i>Your Contacts
                </h3>

                <div class="search-container mb-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input onkeyup="searchContacts()"
                               id="search-input"
                               type="text"
                               class="form-control"
                               placeholder="Search your contacts by name...">
                    </div>
                    <div class="search-result"></div>
                </div>

                <div th:if="${contacts.isEmpty()}" class="text-center py-5">
                    <p class="text-muted fs-5">You haven't added any contacts yet.</p>
                    <a th:href="@{/user/add-contact}" class="btn btn-primary-custom">
                        <i class="fa-solid fa-user-plus me-2"></i>Add Your First Contact
                    </a>
                </div>

                <div th:if="${!contacts.isEmpty()}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">#ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone</th>
                            <th scope="col" class="text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${contacts}">
                            <th scope="row" th:text="${'SCM' + c.cId}">SCM1</th>
                            <td>
                                <i class="fa-solid fa-user-circle text-secondary me-2"></i>
                                <a th:href="@{'/user/contact/' + ${c.cId}}"
                                   class="text-decoration-none fw-semibold text-dark"
                                   th:text="${c.name}">Name</a>
                            </td>
                            <td th:text="${c.email}">email@example.com</td>
                            <td th:text="${c.phone}">1234567890</td>
                            <td class="text-center">
                                <div class="d-inline-flex gap-2">
                                    <form th:action="@{'/user/update-contact/' + ${c.cId}}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-primary-custom" title="Edit">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                    </form>

                                    <a th:href="@{'/user/delete/' + ${c.cId}}"
                                       onclick="return confirm('Are you sure you want to delete this contact?')"
                                       class="btn btn-sm btn-danger"
                                       title="Delete">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <nav th:if="${totalPages > 1}" aria-label="Contacts pagination" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{'/user/show-contacts/' + ${currentPage - 1}}">Previous</a>
                            </li>

                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(1, totalPages)}"
                                th:classappend="${currentPage == i - 1 ? 'active' : ''}">
                                <a class="page-link"
                                   th:href="@{'/user/show-contacts/' + ${i - 1}}"
                                   th:text="${i}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${currentPage + 1 == totalPages ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{'/user/show-contacts/' + ${currentPage + 1}}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>

            </div>
        </div>
    </div>
</section>
</body>
</html>
