<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Dashboard - Smart PhoneBook</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Top Fixed Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom fixed-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/user/index}">
            <i class="fa-solid fa-address-book me-2"></i>Smart PhoneBook
        </a>
        <div class="ms-auto d-flex align-items-center text-white">
                <span class="me-3 fw-semibold">
                    <i class="fa-solid fa-user-circle me-1"></i>
                    <span th:text="${user.name}">User Name</span>
                </span>
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-light">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<!-- Left Sidebar -->
<div class="sidebar">
    <a th:href="@{/user/index}">
        <i class="fa-solid fa-house me-2"></i>Home
    </a>
    <a th:href="@{/user/show-contacts/0}">
        <i class="fa-solid fa-address-card me-2"></i>View Contacts
    </a>
    <a th:href="@{/user/add-contact}">
        <i class="fa-solid fa-user-plus me-2"></i>Add Contact
    </a>
    <div class="divider"></div>
    <a th:href="@{/logout}" class="text-danger">
        <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
    </a>
</div>

<!-- Main Content Area -->
<div class="content">
    <!-- Session Flash Message -->
    <div th:if="${session.message}" th:classappend="${session.messageType}" class="alert alert-dismissible fade show" role="alert">
        <span th:text="${session.message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <th:block th:text="${@sessionUtilityBean.removeMessageFromSession()}"></th:block>
    </div>

    <div th:replace="${content}"></div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Live Contact Search Script -->
<script>
    const searchContacts = () => {
        let query = document.getElementById("search-input").value.trim();
        let resultBox = document.querySelector(".search-result");

        if (query === "") {
            resultBox.style.display = "none";
            return;
        }

        fetch(`/user/search/${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                let html = `<div class="list-group list-group-flush">`;
                if (data.length === 0) {
                    html += `<div class="list-group-item text-muted">No matching contacts found</div>`;
                } else {
                    data.forEach(contact => {
                        html += `<a href="/user/contact/${contact.cid}" class="list-group-item list-group-item-action">
                                        <strong>${contact.name}</strong>
                                        <span class="text-muted small ms-2">(${contact.phone})</span>
                                     </a>`;
                    });
                }
                html += `</div>`;
                resultBox.innerHTML = html;
                resultBox.style.display = "block";
            });
    };
</script>
</body>
</html>
